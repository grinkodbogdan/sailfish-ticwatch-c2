; TicWatch C2 (skipjack): sensors come from the legacy Android HAL
; (/vendor/lib/hw/sensors.sawfish.so, Qualcomm sensor hub), used through the
; hybris adaptors of hybris-libsensorfw-qt5-hal.
; Hardware: LSM6DS3 accelerometer + gyroscope, PAH8011 heart rate, and the
; QTI step counter / orientation algorithms. No light, compass or pressure.
[plugins]
accelerometeradaptor = hybrisaccelerometeradaptor
gyroscopeadaptor = hybrisgyroscopeadaptor
orientationadaptor = hybrisorientationadaptor
stepcounteradaptor = hybrisstepcounteradaptor

[available]
accelerometersensor = True
gyroscopesensor = True
orientationsensor = True
stepcountersensor = True
alssensor = False
compasssensor = False
magnetometersensor = False
pressuresensor = False
proximitysensor = False
rotationsensor = False
tapsensor = False
