<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.sailfishos.skipjack.Sensors"/>
    <allow send_destination="org.sailfishos.skipjack.Sensors"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.sailfishos.skipjack.Sensors"/>
    <deny send_destination="org.sailfishos.skipjack.Sensors" send_interface="org.sailfishos.skipjack.Sensors" send_member="setSystemTime"/>
  </policy>
  <policy group="privileged">
    <allow send_destination="org.sailfishos.skipjack.Sensors" send_interface="org.sailfishos.skipjack.Sensors" send_member="setSystemTime"/>
  </policy>
</busconfig>
